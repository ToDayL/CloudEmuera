name: cloudemuera

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: "${CLOUDEMUERA_PRODUCTION_IMAGE:-cloudemuera:local}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    # Named volumes run as root by default. Set CLOUDEMUERA_UID/GID only when
    # a bind mount must be written as a specific host account.
    user: "${CLOUDEMUERA_UID:-0}:${CLOUDEMUERA_GID:-0}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:${CLOUDEMUERA_CONTAINER_PORT:-28647}"
      CloudEmuera__DataPath: /data
      CloudEmuera__Security__SecureCookies: "${CLOUDEMUERA_SECURITY_SECURE_COOKIES:-false}"
      CloudEmuera__Debugger__TraceMaxBytes: "${CLOUDEMUERA_DEBUG_TRACE_MAX_BYTES-}"
      CLOUDEMUERA_RUNTIME_DEBUG_TRACE: "${CLOUDEMUERA_RUNTIME_DEBUG_TRACE:-false}"
      CLOUDEMUERA_BOOTSTRAP_ADMIN_USERNAME: "${CLOUDEMUERA_BOOTSTRAP_ADMIN_USERNAME:?set CLOUDEMUERA_BOOTSTRAP_ADMIN_USERNAME in docker/.env}"
      CLOUDEMUERA_BOOTSTRAP_ADMIN_EMAIL: "${CLOUDEMUERA_BOOTSTRAP_ADMIN_EMAIL:?set CLOUDEMUERA_BOOTSTRAP_ADMIN_EMAIL in docker/.env}"
      CLOUDEMUERA_BOOTSTRAP_ADMIN_PASSWORD: "${CLOUDEMUERA_BOOTSTRAP_ADMIN_PASSWORD:?set CLOUDEMUERA_BOOTSTRAP_ADMIN_PASSWORD in docker/.env}"
    ports:
      # Keep the application port private to the host by default. Put an
      # external HTTPS reverse proxy in front of it for public access, or set
      # CLOUDEMUERA_HTTP_BIND_ADDRESS explicitly when direct exposure is intended.
      - "${CLOUDEMUERA_HTTP_BIND_ADDRESS:-127.0.0.1}:${CLOUDEMUERA_HTTP_PORT:-28647}:${CLOUDEMUERA_CONTAINER_PORT:-28647}"
    volumes:
      - "${CLOUDEMUERA_DATA_PATH:-cloudemuera-data}:/data"
    restart: unless-stopped
    mem_limit: "${CLOUDEMUERA_MEMORY_LIMIT:-2g}"
    pids_limit: "${CLOUDEMUERA_PIDS_LIMIT:-512}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cloudemuera-data:
